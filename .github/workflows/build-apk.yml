name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

env:
  GODOT_VERSION: "4.6.3"          # must match config/features in project.godot (4.6)
  GODOT_RELEASE: "stable"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_PLATFORM: "android-35"

jobs:
  build-apk:
    name: Export debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }} platforms;${{ env.ANDROID_PLATFORM }}"

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL"
          mv /tmp/templates/templates/* "$TPL/"
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

      - name: Configure Godot (Android SDK, JDK, debug keystore)
        run: |
          set -euxo pipefail
          GODOT="$HOME/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          # Throw-away debug keystore generated on the fly: no secrets needed.
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          cat ~/.config/godot/editor_settings-4.6.tres

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          # The first import can exit non-zero while it builds the cache; run it twice.
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: Export debug APK
        run: |
          set -euxo pipefail
          mkdir -p build
          "$GODOT" --headless --path . --export-debug "Android" build/bombies-dead-zone-debug.apk
          ls -la build
          test -s build/bombies-dead-zone-debug.apk

      - name: Verify APK
        run: |
          BT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"
          "$BT/aapt2" dump badging build/bombies-dead-zone-debug.apk | grep -E "^package|native-code"
          "$BT/apksigner" verify --verbose build/bombies-dead-zone-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bombies-dead-zone-apk
          path: build/bombies-dead-zone-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bombies Dead Zone debug build ${{ github.run_number }}
          body: Installable debug-signed arm64-v8a APK built from ${{ github.sha }}.
          files: build/bombies-dead-zone-debug.apk
          prerelease: true
